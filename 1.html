<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IN核玩野</title>
    <style>
        .diy-container {
            width: 100%;
            max-width: 900px;
            padding: 6vw;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }
        .diy-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-bottom: 15px;
            margin-bottom: 15px;
            position: relative;
        }
        .diy-title-main h1 {
            font-size: 28px;
            margin: 0 0 5px 0;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .diy-title-main p {
            font-size: 14px;
            margin: 0;
            color: #B0B0B0;
        }
        .diy-credits {
            text-align: right;
            font-size: 11px;
            line-height: 1.5;
            color: #A0A0A0;
            padding-top: 5px;
            border-top: solid;
            border-top-width: medium;
        }
        .diy-credits p {
            margin: 0;
        }
        .diy-main-visual {
            width: 100%;
            margin-bottom: 30px;
            background-color: #000;
        }
        .diy-main-visual img {
            width: 100%;
            height: auto;
            display: block;
            border: 2px solid #333;
            border-radius: 8px;
        }
        .diy-project-intro {
            margin-bottom: 60px;
            padding-left: 10px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }
        .diy-project-intro h2 {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            display: inline-block;
            position: relative;
            padding-bottom: 8px;
        }
        .diy-project-intro h2::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 3px;
            background-color: #FFFFFF;
        }
        .diy-project-intro p {
            font-size: 13px;
            line-height: 1.9;
            color: #D0D0D0;
            margin-bottom: 25px;
        }
        .diy-color-palette {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            align-items: center;
        }
        .diy-color-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1.5px solid #FFFFFF;
        }
        .diy-footer-logo-container {
            margin-bottom: 40px;
            text-align: center;
        }
        .diy-footer-logo-container img {
            max-width: 60%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .diy-footer-tagline {
            font-size: 11px;
            color: #999999;
            border: 1px solid #777777;
            padding: 6px 12px;
            border-radius: 15px;
            display: inline-block;
        }
        .diy-footer-logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Styles for the new background layer */
        .diy-visual-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .diy-visual-background img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(8px);
        }
        .diy-visual-background::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #00000080, #000);
        }
    </style>
</head>
<body>
    <div class="diy-container">
        <div class="diy-visual-background">
            <img src="https://picsum.photos/seed/12133/1920/1080" alt="Page Background">
        </div>
        <header class="diy-header">
            <div class="diy-header-left">
                <div class="diy-title-main">
                    <h1>《IN核玩野》</h1>
                    <p>金沙印象城开学季主kv</p>
                </div>
            </div>
            <div class="diy-credits">
                <p>Designer: Qiuu</p>
                <p>Illustrator: 林晨</p>
                <p>Time: 2019.09</p>
            </div>
        </header>

        <section class="diy-main-visual">
            <img src="https://picsum.photos/seed/12133/1920/1080" alt="IN核玩野 主视觉图">
        </section>

        <section class="diy-project-intro">
            <h2>项目介绍</h2>
            <div>
            <p>项目方为——杭州金沙印象城.是一个开学季的特别企划主kv.<br>
               插画部分是公司同事橙子所创作,我做了字体以及延伸海报等.<br>
               因为面对的是大学生这些年轻群体,所以做的风格偏向于潮玩这些元素.<br>
               IN核玩野,同"硬核",突出玩法多种多样.</p>
            <div class="diy-color-palette">
                <span class="diy-color-dot" style="background-color: #FF3E9A;"></span>
                <span class="diy-color-dot" style="background-color: #4D6FFF;"></span>
                <span class="diy-color-dot" style="background-color: #4DFFF3;"></span>
                <span class="diy-color-dot" style="background-color: #6A4DFF;"></span>
                <span class="diy-color-dot" style="background-color: #3D2A99;"></span>
                <span class="diy-color-dot" style="background-color: #FFB84D;"></span>
            </div>
        </div>
        </section>
        <footer class="diy-footer-logo-area">
            <div class="diy-footer-logo-container">
                <img src="http://localhost/uploads/allimg/250509/1-2505091H64b61.png" alt="IN核玩野 底部Logo">
            </div>
            <p class="diy-footer-tagline">-金沙印象城开学季特别企划-</p>
        </footer>
    </div>
</body>
</html>
