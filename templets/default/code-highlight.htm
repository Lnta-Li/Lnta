<!-- 引入 Highlight.js 核心文件 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<!-- 引入中文语言包 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/go.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/php.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/html.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 获取所有代码块
    const codeBlocks = document.querySelectorAll('code');
    
    codeBlocks.forEach(code => {
        // 检测代码类型
        const codeContent = code.textContent.trim();
        let codeType = 'plain';
        
        // 检测代码类型
        if (codeContent.includes('<?php') || codeContent.includes('$')) {
            codeType = 'php';
        } else if (codeContent.includes('@font-face') || codeContent.includes('{') || codeContent.includes('}')) {
            codeType = 'css';
        } else if (codeContent.includes('<') && codeContent.includes('>')) {
            codeType = 'html';
        } else if (codeContent.includes('function') || codeContent.includes('var') || codeContent.includes('const')) {
            codeType = 'javascript';
        }
        
        // 添加语言类
        code.classList.add('hljs');
        code.classList.add('language-' + codeType);
        
        // 添加代码类型标签
        const langLabel = document.createElement('div');
        langLabel.className = 'code-lang-label';
        langLabel.textContent = codeType.toUpperCase();
        code.insertBefore(langLabel, code.firstChild);
        
        // 处理多余的换行
        const finalContent = code.innerHTML;
        code.innerHTML = finalContent.replace(/<br><br>/g, '<br>');
    });
    
    // 初始化 Highlight.js
    hljs.highlightAll();
});
</script>

<style>
/* 自定义样式 */
.code-lang-label {
    position: absolute;
    top: 0;
    right: 10px;
    padding: 2px 8px;
    background: #333;
    color: #fff;
    font-size: 12px;
    border-radius: 3px;
}

code {
    position: relative;
    padding-top: 30px !important;
    display: block;
    background: #f8f8f8;
    border-radius: 4px;
    overflow-x: auto;
}

.hljs {
    padding: 1em;
    line-height: 1.5;
    font-family: 'Consolas', 'Monaco', 'Andale Mono', monospace;
}

/* 移除关键词的加粗效果 */
.hljs-attribute, .hljs-doctag, .hljs-keyword, .hljs-meta .hljs-keyword, .hljs-name, .hljs-selector-tag {
    font-weight: normal !important;
}
</style>
